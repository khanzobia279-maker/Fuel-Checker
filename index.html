<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fuel Checker</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛽</text></svg>" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
<h1>⛽ <span>Fuel</span> Checker 🚗</h1>
    <div class="container">
      <input type="number" id="fuelInput" placeholder="Enter Fuel In Litres" />
      <div class="button-group">
        <button onclick="fuelChecker()">Check</button>
        <button onclick="resetForm()" class="reset-btn">Reset</button>
      </div>
      <p id="message"></p>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
