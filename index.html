<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Checker</title>
    <link rel="icon" type="image/jpeg" href="https://www.shutterstock.com/shutterstock/videos/4011454697/thumb/6.jpg?ip=x480">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1><span style="color:#2563eb;font-weight:900;letter-spacing:2px;font-size:2.2em;font-family:'Segoe UI',Arial,sans-serif;">Fuel Checker</span></h1>
    <div class="container">
        <input type="number" id="fuelInput" placeholder="Enter Fuel In Litres">
        <button onclick="fuelChecker()">Check</button>
        <p id="message"></p>
    </div>
    <script src="./app.js"></script>
</body>

</html>
